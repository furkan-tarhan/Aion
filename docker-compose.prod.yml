# Production ortamı: optimize build (Next.js standalone, derlenmiş backend), Nginx reverse proxy.
#
# Kullanım:
#   1) backend/.env ve frontend/.env dosyalarını .env.example'lardan kopyalayıp doldurun
#   2) docker compose -f docker-compose.prod.yml up --build -d
#   3) Tarayıcı: http://localhost  (varsayılan port 80, NGINX_PORT ile değiştirilebilir)

services:
  mongo:
    image: mongo:7
    container_name: zade-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: zade-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      target: prod
    container_name: zade-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/L3X4
      REDIS_URL: redis://redis:6379
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_SITE_URL: "http://localhost:${NGINX_PORT:-80}"
        # Sentry DSN gizli değildir; tanımsız bırakılırsa (varsayılan) Sentry devre dışı kalır.
        NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
    container_name: zade-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:5000
      SENTRY_DSN: "${SENTRY_DSN:-}"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: zade-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  backend_logs:
