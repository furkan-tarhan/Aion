# Geliştirme ortamı: hot-reload (kaynak kod bind mount), Nginx reverse proxy arkasında.
#
# Kullanım:
#   1) backend/.env ve frontend/.env dosyalarını .env.example'lardan kopyalayıp doldurun
#   2) docker compose up --build
#   3) Tarayıcı: http://localhost:8080  (backend: http://localhost:5000, mongo: localhost:27017)

services:
  mongo:
    image: mongo:7
    container_name: zade-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: zade-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      target: dev
    container_name: zade-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/L3X4
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: zade-frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: "http://localhost:${NGINX_PORT:-8080}"
      API_INTERNAL_URL: http://backend:5000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/messages:/app/messages
      - ./frontend/public:/app/public
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: zade-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
